<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Trace evidence into design. Explore research, spatial analyses and projects from the Future Healthy Cities UrbanLab." />
    <meta name="theme-color" content="#ffffff" />
    <title>Urban Evidence Hub</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="assets/graph.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Shared header: centred brand and navigation, right-hand search, full-width Hub bar. -->
    <header class="site-header">
      <a class="brand" href="#/home" aria-label="Urban Evidence Hub home">
        <svg class="brand-logo" viewBox="402 391 1247 1281" aria-hidden="true" focusable="false"><image href="assets/ueh-logo.png" width="2048" height="2048" /></svg>
        <span>Urban Evidence Hub</span>
      </a>
      <button class="menu-button" aria-controls="main-nav" aria-expanded="false" type="button">Menu</button>
      <nav id="main-nav" aria-label="Main navigation">
        <a href="#/home" data-page="home" data-label="Home"><span>Home</span></a>
        <div class="hub-nav">
          <a href="#/hub/graph" data-page="hub" data-label="Hub" aria-controls="hub-subnav" aria-expanded="false"><span>Hub</span></a>
          <div id="hub-subnav" class="hub-subnav" aria-label="Hub views">
            <div class="hub-subnav-links">
              <a href="#/hub/graph" data-view="graph" data-label="Knowledge graph"><span>Knowledge graph</span></a>
              <a href="#/hub/grid" data-view="grid" data-label="Grid"><span>Grid</span></a>
            </div>
          </div>
        </div>
        <a href="#/projects" data-page="projects" data-label="Projects"><span>Projects</span></a>
        <a href="#/publications" data-page="publications" data-label="Publications"><span>Publications</span></a>
        <a href="#/people" data-page="people" data-label="People"><span>People</span></a>
      </nav>
      <form id="site-search" class="search-field" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 5 5" /></svg>
        <label class="sr-only" for="global-search">Search evidence, projects and more</label>
        <input id="global-search" name="q" type="search" placeholder="Search the hub…" autocomplete="off" />
      </form>
    </header>

    <!-- Page content is rendered from the current URL by app.js. -->
    <main id="main" tabindex="-1"><p class="loading" role="status">Loading the Urban Evidence Hub…</p></main>
    <noscript><p class="container">Enable JavaScript to browse the evidence collection.</p></noscript>

    <!-- One shared evidence drawer serves Grid and Knowledge Graph. -->
    <aside id="evidence-detail" class="detail-panel" role="dialog" aria-label="Evidence details" hidden></aside>

    <footer class="site-footer">
      <a href="#/home">Urban Evidence Hub</a>
      <span>Future Healthy Cities UrbanLab</span>
    </footer>
  </body>
</html>
